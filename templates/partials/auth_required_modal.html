{% load i18n acd_i18n %}
<!-- Shared "please sign in" modal — shown instead of a hard redirect when a
     signed-out visitor clicks "خرید" (Buy) on ACDPay/ACDBallons (see the
     anonymous branch of the buy button in templates/shop/acdpay.html and
     acdballoons.html: it's a <button data-bs-toggle="modal" ...> instead of
     a plain login link now). Kept here, included once from base.html, so
     any page with a buy button can open it without duplicating the markup.

     The trigger button carries data-login-url / data-signup-url (each
     already baked with ?next=<that exact product's buy URL>); static/js/
     main.js copies those onto this modal's two buttons the moment it opens
     (show.bs.modal), so "ورود به حساب" / "عضویت" send the visitor straight
     back to checkout for the product they actually tried to buy — not a
     generic login page they'd have to navigate away from again. -->
<div class="modal fade" id="authRequiredModal" tabindex="-1" aria-labelledby="authRequiredModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content acd-auth-modal">
      <button type="button" class="btn-close acd-auth-modal-close" data-bs-dismiss="modal" aria-label="{% t 'بستن' %}"></button>
      <div class="modal-body text-center px-4 pt-5 pb-4">
        <span class="acd-auth-modal-icon"><i class="bi bi-shield-lock-fill"></i></span>
        <h2 class="h5 fw-bold mt-4 mb-2" id="authRequiredModalLabel">{% t "برای خرید، ابتدا وارد شوید" %}</h2>
        <p class="text-muted small mb-4">
          {% t "برای ثبت سفارش و پیگیری آن در «محصولات من»، باید وارد حساب کاربری‌تان شوید." %}
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-acd-primary w-100" id="authRequiredModalLoginBtn">
          <i class="bi bi-box-arrow-in-left me-1"></i>{% t "ورود به حساب" %}
        </a>
        <a href="{% url 'accounts:signup' %}" class="btn btn-link w-100 mt-2 acd-auth-modal-signup" id="authRequiredModalSignupBtn">
          {% t "حساب کاربری ندارید؟ عضو شوید" %}
        </a>
      </div>
    </div>
  </div>
</div>
